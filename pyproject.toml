[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-rewards-engine"
version = "0.1.0"
description = "Deterministic, auditable loyalty and rewards engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
loyalty-demo = "loyalty_rewards.demo:main"
loyalty-mcp = "loyalty_rewards.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
